[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abide-gnn"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "nilearn",
    "numpy",
    "scikit-learn",
    "torch",
    "torch-geometric",
    "wandb>=0.28.2,<0.29",
]

[project.scripts]
abide-gnn-predict = "abide_gnn.inference:main"

[tool.setuptools]
packages = ["abide_gnn"]
